<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECO 414 Classroom Games</title>
<meta name="description" content="Ultimatum and Dictator games for the classroom. Works offline and syncs later.">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root {
  --bg: #f4f5f7; --surface: #fbfbfc; --card: #ffffff; --ink: #18181b; --ink2: #52525b; --muted: #8b8b93;
  --line: #e4e4e7; --accent: #2563eb; --accent-ink: #ffffff; --accent-soft: #eaf0fd; --ug: #2563eb; --dg: #d97706;
  --ok: #15803d; --ok-soft: #e8f6ec; --warn: #b45309; --warn-soft: #fdf3e3; --bad: #b91c1c; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111113; --surface: #1a1a1d; --card: #1f1f23; --ink: #ececef; --ink2: #b4b4bb; --muted: #85858d;
    --line: #2f2f35; --accent: #3b82f6; --accent-ink: #ffffff; --accent-soft: #1b2638; --ug: #3b82f6; --dg: #d97706;
    --ok: #4ade80; --ok-soft: #14271b; --warn: #fbbf24; --warn-soft: #2b2312; --bad: #f87171; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #111113; --surface: #1a1a1d; --card: #1f1f23; --ink: #ececef; --ink2: #b4b4bb; --muted: #85858d;
  --line: #2f2f35; --accent: #3b82f6; --accent-ink: #ffffff; --accent-soft: #1b2638; --ug: #3b82f6; --dg: #d97706;
  --ok: #4ade80; --ok-soft: #14271b; --warn: #fbbf24; --warn-soft: #2b2312; --bad: #f87171; --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
header { background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 4; }
header .brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; cursor: pointer; background: none; border: 0; padding: 0; color: inherit; font: inherit; text-align: left; }
header .logo { width: 30px; height: 30px; flex: none; }
header h1 { font-size: 16px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.net { font-size: 13px; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.net.on { background: var(--ok-soft); color: var(--ok); }
.net.off { background: var(--warn-soft); color: var(--warn); }
main { max-width: 680px; margin: 0 auto; padding: 16px; }
main.wide { max-width: 1100px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
h2 { font-size: 22px; margin: 0 0 6px; line-height: 1.25; }
h3 { font-size: 16px; margin: 18px 0 6px; }
p { margin: 8px 0; }
.muted { color: var(--muted); } .sub { color: var(--ink2); } .small { font-size: 14px; }
button, .btn { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 16px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.big { font-size: 18px; padding: 14px 20px; width: 100%; margin-top: 12px; }
button.link { border: none; background: none; color: var(--accent); padding: 4px; text-decoration: underline; }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
.tile { display: flex; gap: 14px; align-items: flex-start; text-align: left; padding: 16px; border-radius: 14px; width: 100%; margin-top: 10px; background: var(--card); box-shadow: var(--shadow); }
.tile .ic { font-size: 28px; line-height: 1; flex: none; }
.tile b { display: block; font-size: 17px; }
.tile span { color: var(--ink2); font-size: 14px; }
.tile.hero { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tile.hero span { color: var(--accent-ink); opacity: .9; }
label { display: block; font-weight: 600; margin: 14px 0 4px; }
input[type=text], input[type=number], input[type=password], input[type=url], select, textarea { font: inherit; width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
textarea { min-height: 110px; font-family: ui-monospace, Consolas, monospace; font-size: 14px; }
.hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
.progress { display: flex; gap: 6px; margin-bottom: 14px; }
.progress i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.progress i.on { background: var(--accent); }
.tag { display: inline-block; font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 3px 10px; border-radius: 999px; margin-bottom: 8px; }
.amount { font-size: 42px; font-weight: 700; text-align: center; margin: 10px 0 0; font-variant-numeric: tabular-nums; }
.split { display: flex; justify-content: space-between; color: var(--ink2); font-size: 15px; margin-top: 2px; gap: 8px; }
.splitbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin: 8px 0 2px; background: var(--line); }
.splitbar .k { background: var(--muted); opacity: .45; } .splitbar .g { background: var(--accent); }
input[type=range] { width: 100%; height: 36px; accent-color: var(--accent); }
.stepper { display: flex; gap: 8px; justify-content: center; }
.stepper button { min-width: 72px; }
.review { width: 100%; border-collapse: collapse; }
.review td { padding: 10px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.review td.v { text-align: right; font-weight: 700; white-space: nowrap; }
.status { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 12px; margin: 10px 0; font-size: 15px; }
.status.ok { background: var(--ok-soft); color: var(--ok); } .status.wait { background: var(--warn-soft); color: var(--warn); }
.code { font: 700 22px/1.3 ui-monospace, Consolas, monospace; text-align: center; background: var(--accent-soft); border-radius: 10px; padding: 12px; word-break: break-all; user-select: all; }
.code.huge { font-size: 54px; letter-spacing: 6px; }
.qr { display: flex; justify-content: center; margin: 14px 0; }
.qr svg { width: 220px; height: 220px; background: #fff; padding: 8px; border-radius: 10px; }
.qr.big svg { width: min(340px, 80vw); height: min(340px, 80vw); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); font-size: 13px; color: var(--ink2); }
.handoff { text-align: center; padding: 34px 20px; }
.emoji { font-size: 52px; line-height: 1.2; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; font-variant-numeric: tabular-nums; }
th { color: var(--ink2); font-weight: 600; }
td.num, th.num { text-align: right; }
.tablewrap { overflow-x: auto; max-height: 460px; overflow-y: auto; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.stat .v { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 13px; color: var(--ink2); }
.legend { display: flex; gap: 16px; font-size: 14px; color: var(--ink2); margin: 6px 0; flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink2); font-size: 12px; }
.chart .axis { stroke: var(--line); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 13px; padding: 6px 9px; border-radius: 6px; white-space: nowrap; display: none; z-index: 9; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tabs button { padding: 8px 14px; }
.tabs button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.bar select { width: auto; min-width: 220px; }
video { width: 100%; max-width: 420px; border-radius: 10px; background: #000; display: block; margin: 0 auto; }
.notice { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
.err { color: var(--bad); font-size: 14px; }
.list .item { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.list .item:last-child { border-bottom: 0; }
footer { text-align: center; color: var(--muted); font-size: 13px; padding: 18px 16px 30px; }
@media print { header, footer, .noprint { display: none !important; } body { background: #fff; } .card { border: none; box-shadow: none; } }
</style>
</head>
<body>
<header>
  <button class="brand" type="button" id="homeBtn" aria-label="Home">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#2563eb"/><path d="M16 4 A12 12 0 1 1 8.9 25.7 L16 16Z" fill="#fff"/><path d="M8.9 25.7 A12 12 0 0 1 16 4 L16 16Z" fill="#d97706"/></svg>
    <h1>ECO 414 Classroom Games</h1>
  </button>
  <span class="net" id="net"></span>
</header>
<main id="app"></main>
<footer class="noprint"><span id="foot">Works offline. Results are sent when you are online.</span> · <button class="link" type="button" id="lectLink">Lecturer</button></footer>
<div class="tip" id="tip"></div>

<!--SERVER-->
<!--VENDOR_QRCODE-->
<!--VENDOR_JSQR-->
<script>
"use strict";
/* =====================================================================
   Configuration. DEFAULT_BACKEND is the Google Apps Script web app URL
   (see backend/Code.gs). Join links also carry it, so it can stay empty.
   ===================================================================== */
const DEFAULT_BACKEND = "https://script.google.com/macros/s/AKfycbyg1JA8r_COFnGmw2LTdLhTUyESrIexNgneetf0EBFwNEmYbJA_rM5IH0SNHdqxhvtRMg/exec";
const PUBLIC_URL = "https://zingdavid.github.io/eco414-games/";
const SERVER = !!window.ECO_SERVER;           // page served by the lecturer's laptop (server.py)
let SERVER_BASE = "";                          // the laptop's network address, for the join QR code

/* ---------- small helpers ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("eco414." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("eco414." + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem("eco414." + k); } catch (e) {} }
};
const app = document.getElementById("app");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nick = (s) => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 10);
const scode = (s) => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
const rand = (n, a = "ABCDEFGHJKMNPQRSTUVWXYZ23456789") => { let s = ""; const r = crypto.getRandomValues(new Uint32Array(n)); for (const x of r) s += a[x % a.length]; return s; };
const money = (x, cur) => (cur || "MWK") + " " + Math.round(Number(x)).toLocaleString();
function view(html, wide) { stopCam(); app.className = wide ? "wide" : ""; app.innerHTML = html; window.scrollTo(0, 0); }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ---------- device identity (lets a student fetch only their own result) ---------- */
let TOKEN = store.get("token", "");
if (!TOKEN) { TOKEN = rand(16); store.set("token", TOKEN); }
let PROFILE = store.get("profile", { name: "", sno: "" });

/* ---------- backend: Google Apps Script or the lecturer's laptop, same API ---------- */
const backend = () => (SERVER ? "/api" : store.get("backend", "") || DEFAULT_BACKEND);
async function bGet(params) {
  const u = new URL(backend(), location.href);
  Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
  const r = await fetch(u.toString(), { cache: "no-store", redirect: "follow" });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "error");
  return j;
}
async function bPost(body) {
  const r = await fetch(backend(), { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body), redirect: "follow" });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "error");
  return j;
}

/* ---------- outbox: results wait here until they can be sent ---------- */
const outbox = () => store.get("outbox", []);
function queue(items) { const o = outbox(); const have = new Set(o.map((x) => x.uid)); items.forEach((x) => { if (!have.has(x.uid)) o.push(x); }); store.set("outbox", o); updateNet(); }
let flushing = false;
async function flush() {
  if (flushing || !backend()) return false;
  flushing = true;
  try {
    while (outbox().length) {
      const batch = outbox().slice(0, 25);
      const res = await bPost({ action: "submit", items: batch });
      const done = new Set(res.done || []);
      store.set("outbox", outbox().filter((x) => !done.has(x.uid)));
      const mine = store.get("mine", []); mine.forEach((m) => { if (done.has(m.uid)) m.sent = true; }); store.set("mine", mine);
      if (!done.size) break;
    }
    return true;
  } catch (e) { return false; }
  finally { flushing = false; updateNet(); }
}
function updateNet() {
  const n = outbox().length, on = navigator.onLine;
  const el = $("net");
  el.className = "net " + (on ? "on" : "off");
  el.textContent = (on ? "Online" : "Offline") + (n ? ` · ${n} to send` : "");
  el.title = n ? `${n} result(s) saved on this device, waiting to be sent` : "";
}
window.addEventListener("online", () => { updateNet(); flush(); });
window.addEventListener("offline", updateNet);
setInterval(() => { if (outbox().length && navigator.onLine) flush(); }, 20000);

/* ---------- session the student has joined ---------- */
let SESSION = store.get("session", null);   // {code, stake, step, cur, title}
function joinFromParams() {
  const q = new URLSearchParams(location.search);
  if (!q.get("join")) return false;
  const code = scode(q.get("join")), stake = +q.get("k") || 1000, step = +q.get("t") || 50;
  if (q.get("b") && !SERVER) store.set("backend", q.get("b"));
  SESSION = { code, stake, step, cur: (q.get("c") || "MWK").slice(0, 6), title: (q.get("n") || "").slice(0, 60) };
  store.set("session", SESSION);
  history.replaceState(null, "", location.pathname);
  return true;
}
const joinUrl = (s) => {
  const base = SERVER ? SERVER_BASE || location.origin + "/" : PUBLIC_URL;
  const p = new URLSearchParams({ join: s.code, k: s.stake, t: s.step, c: s.cur });
  if (s.title) p.set("n", s.title);
  if (!SERVER && backend() && backend() !== DEFAULT_BACKEND) p.set("b", backend());
  return base + "?" + p.toString();
};

/* ---------- QR ---------- */
function qrSvg(text) { try { const q = qrcode(0, "L"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); } catch (e) { return ""; } }

/* =====================================================================
   STUDENT SCREENS
   ===================================================================== */
function home() {
  const mine = store.get("mine", []);
  view(`
    ${SESSION ? `<div class="card"><span class="tag">Session ${esc(SESSION.code)}</span>
      <h2>${esc(SESSION.title || "Ultimatum and Dictator games")}</h2>
      <p class="sub">You will decide how to share ${money(SESSION.stake, SESSION.cur)} with a classmate. Takes about 3 minutes.</p>
      <button class="tile hero" type="button" id="play"><span class="ic">▶</span><div><b>Start playing</b><span>Three short decisions, then you are paired at random</span></div></button>
      <button class="link small" type="button" id="leave">Not your session? Join a different one</button></div>`
    : `<div class="card"><h2>Welcome</h2><p class="sub">Join your lecturer's session to start. Scan the QR code on the projector with your camera, or enter the session code.</p>
      <button class="tile hero" type="button" id="join"><span class="ic">＋</span><div><b>Join a session</b><span>Scan the QR code or type the code</span></div></button></div>`}
    <button class="tile" type="button" id="results"><span class="ic">📊</span><div><b>My results</b><span>${mine.length ? `${mine.length} game${mine.length === 1 ? "" : "s"} played. See your partner's choices and your earnings.` : "Your earnings appear here after your lecturer pairs the class."}</span></div></button>
    <button class="tile" type="button" id="pair"><span class="ic">👥</span><div><b>Play with a partner on this device</b><span>Two players share one screen and see a real offer</span></div></button>
    <button class="tile" type="button" id="install" hidden><span class="ic">⬇</span><div><b>Install the app</b><span>Open it from your home screen, even without internet</span></div></button>`);
  if ($("play")) $("play").onclick = () => profile(soloStart);
  if ($("leave")) $("leave").onclick = joinScreen;
  if ($("join")) $("join").onclick = joinScreen;
  $("results").onclick = myResults;
  $("pair").onclick = pairStart;
  if (INSTALL && !SERVER) { $("install").hidden = false; $("install").onclick = async () => { INSTALL.prompt(); await INSTALL.userChoice; INSTALL = null; home(); }; }
}
let INSTALL = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); INSTALL = e; if ($("install")) { $("install").hidden = false; $("install").onclick = async () => { INSTALL.prompt(); await INSTALL.userChoice; INSTALL = null; home(); }; } });

function joinScreen() {
  view(`<div class="card"><h2>Join a session</h2>
    <p class="sub">Your lecturer shows a QR code and a session code on the projector.</p>
    <button class="primary big" type="button" id="scan">📷 Scan the QR code</button>
    <div id="camBox" style="margin-top:12px"></div>
    <label for="jc">Or type the session code</label>
    <input type="text" id="jc" maxlength="8" autocomplete="off" placeholder="e.g. KTWM" style="text-transform:uppercase;font-size:22px;letter-spacing:3px">
    <p class="err" id="jerr"></p>
    <button class="big" type="button" id="jgo">Join</button>
    <button class="link" type="button" id="back">Back</button></div>`);
  $("back").onclick = home;
  $("scan").onclick = () => startCam($("camBox"), (txt) => {
    try { const u = new URL(txt); if (u.searchParams.get("join")) { history.replaceState(null, "", "?" + u.searchParams.toString()); joinFromParams(); stopCam(); joined(); return true; } } catch (e) {}
    $("jerr").textContent = "That QR code is not a session code."; return false;
  }, (msg) => ($("jerr").textContent = msg));
  const go = async () => {
    const code = scode($("jc").value);
    if (code.length < 3) { $("jerr").textContent = "Type the code shown on the projector."; return; }
    $("jerr").textContent = "Looking up the session…";
    try {
      if (!backend()) throw new Error("nobackend");
      const r = await bGet({ action: "session", code });
      const s = r.session;
      SESSION = { code, stake: +s.stake, step: +s.step, cur: s.currency || "MWK", title: s.title || "" };
      store.set("session", SESSION); joined();
    } catch (e) {
      $("jerr").innerHTML = e.message === "no such session" ? "No session with that code. Check the code on the projector." :
        `Could not look up the code${navigator.onLine ? "" : " because you are offline"}. Scan the QR code instead, or <button class="link" type="button" id="offj">continue offline with ${money(1000)}</button>.`;
      if ($("offj")) $("offj").onclick = () => { SESSION = { code, stake: 1000, step: 50, cur: "MWK", title: "" }; store.set("session", SESSION); joined(); };
    }
  };
  $("jgo").onclick = go; $("jc").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
}
function joined() {
  view(`<div class="card handoff"><div class="emoji">✅</div><h2>You joined session ${esc(SESSION.code)}</h2>
    <p class="sub">${esc(SESSION.title || "")} Stake: ${money(SESSION.stake, SESSION.cur)}</p>
    <button class="primary big" type="button" id="go">Start playing</button></div>`);
  $("go").onclick = () => profile(soloStart);
}

function profile(next) {
  view(`<div class="card"><h2>About you</h2>
    <p class="sub">Your lecturer sees your name with your choices. Other students never see who their partner was.</p>
    <label for="pn">Your name</label><input type="text" id="pn" maxlength="40" autocomplete="name" value="${esc(PROFILE.name)}">
    <label for="ps">Student number <span class="muted">(optional)</span></label><input type="text" id="ps" maxlength="20" inputmode="numeric" value="${esc(PROFILE.sno)}">
    <p class="err" id="perr"></p>
    <button class="primary big" type="button" id="go">Continue</button></div>`);
  $("go").onclick = () => {
    const name = $("pn").value.trim().replace(/\s+/g, " ");
    if (!name) { $("perr").textContent = "Please enter your name."; return; }
    PROFILE = { name, sno: $("ps").value.trim() }; store.set("profile", PROFILE); next();
  };
}

/* ---------- amount picker ---------- */
function picker(id, start, stake, step, labels) {
  return `<div class="amount" id="${id}_v"></div>
  ${labels ? `<div class="splitbar" aria-hidden="true"><div class="k" id="${id}_kb"></div><div class="g" id="${id}_gb"></div></div>
  <div class="split"><span id="${id}_keep"></span><span id="${id}_give"></span></div>` : ""}
  <input type="range" id="${id}" min="0" max="${stake}" step="${step}" value="${start}" aria-label="Amount">
  <div class="stepper"><button type="button" data-d="-1" data-for="${id}" aria-label="Less">− ${step}</button><button type="button" data-d="1" data-for="${id}" aria-label="More">+ ${step}</button></div>`;
}
function wirePicker(id, stake, step, cur, labels) {
  const r = $(id);
  const upd = () => {
    const v = +r.value; $(id + "_v").textContent = money(v, cur);
    if (labels) {

const codeOf = (d) => d.mode === "S" ? `S-${d.session || "X"}-${nick(d.name) || "ANON"}-${d.o}-${d.m}-${d.g}-${d.b}-${d.stake}`
  : `P-${d.session || "X"}-${nick(d.name)}-${nick(d.partner)}-${d.o}-${d.r}-${d.g}-${d.stake}`;
const CODE_RE = /\b(?:S-([A-Z0-9]{1,8})-([A-Z0-9]{1,10})-(\d+)-(\d+)-(\d+)-(\d+)-(\d+)|P-([A-Z0-9]{1,8})-([A-Z0-9]{1,10})-([A-Z0-9]{1,10})-(\d+)-([AR])-(\d+)-(\d+))\b/g;
function parseCodes(text) {
  const out = []; let m; const t = String(text).toUpperCase(); CODE_RE.lastIndex = 0;
  while ((m = CODE_RE.exec(t))) {
    const now = new Date().toISOString();
    if (m[1]) { const r = { uid: "C" + m[0], mode: "S", session: m[1] === "X" ? "" : m[1], name: m[2], sno: "", partner: "", token: "", stake: +m[7], o: +m[3], m: +m[4], r: "", g: +m[5], b: +m[6], t: now };
      if (r.stake > 0 && [r.o, r.m, r.g, r.b].every((x) => x <= r.stake)) out.push(r); }
    else { const r = { uid: "C" + m[0], mode: "P", session: m[8] === "X" ? "" : m[8], name: m[9], sno: "", partner: m[10], token: "", stake: +m[14], o: +m[11], m: "", r: m[12], g: +m[13], b: "", t: now };
      if (r.stake > 0 && r.o <= r.stake && r.g <= r.stake) out.push(r); }
  }
  return out;
}

let CAM = null;
async function startCam(box, onText, onErr) {
  if (CAM) { stopCam(); return; }
  if (!navigator.mediaDevices || typeof jsQR !== "function") { onErr("This device cannot use the camera here."); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    box.innerHTML = '<video id="vid" playsinline muted></video>';
    const v = $("vid"); v.srcObject = stream; await v.play();
    const c = document.createElement("canvas"), ctx = c.getContext("2d", { willReadFrequently: true });
    let last = "";
    CAM = { stream, box, timer: setInterval(() => {
      if (!v.videoWidth) return;
      c.width = v.videoWidth; c.height = v.videoHeight; ctx.drawImage(v, 0, 0);
      const q = jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: "dontInvert" });
      if (q && q.data && q.data !== last) { last = q.data; if (onText(q.data)) beep(); }
    }, 250) };
  } catch (e) { onErr("Camera not available. Type the code instead."); }
}

    <h2 style="font-size:28px">Join session</h2>
    <div class="qr big">${qrSvg(url)}</div>
    <p class="sub" style="font-size:18px">Scan with your phone camera, or open the app and type the code:</p>
    <div class="code huge">${esc(s.code)}</div>
    <p class="sub" style="margin-top:12px">${esc(s.title || "")} · ${money(s.stake, s.cur)} in steps of ${s.step}</p>
    <p class="muted small" style="word-break:break-all">${esc(url)}</p>
    ${SERVER ? `<p class="small notice">Students must be on the same Wi-Fi or lab network as this laptop.</p>` : `<p class="small notice">Students without internet can still play once the app is installed; their answers are sent when they reconnect.</p>`}
  </div>`;
}

/* ---------- data: remote (sheet/server) + local codes ---------- */
function allData() {
  const m = new Map();
  [...REMOTE, ...LOCAL].forEach((d) => m.set(d.uid, d));
  return [...m.values()];
}
function sessionData() {
  // latest answer per student (a student may change answers and submit again)
  const by = new Map();
  allData().filter((d) => (d.session || "") === CUR).sort((a, b) => String(a.received || a.t).localeCompare(String(b.received || b.t)))
    .forEach((d) => by.set(d.mode === "S" ? "S|" + (d.sno || nick(d.name)) : "P|" + nick(d.name) + "|" + nick(d.partner), d));
  return [...by.values()];
}
async function pull() {
  await syncSessions(); await flush();
  const r = await bGet({ action: "results", key: KEY });
  REMOTE = (r.responses || []).map(fromRow); store.set("lremote", REMOTE);
  LAST = new Date().toISOString(); store.set("llast", LAST);
  (r.sessions || []).forEach((x) => { if (!SESSIONS.some((s) => s.code === String(x.code))) SESSIONS.push({ code: String(x.code), title: x.title || "", stake: +x.stake, step: +x.step, cur: x.currency || "MWK", created: x.created, synced: true }); });
  store.set("lsessions", SESSIONS);
}
const fromRow = (x) => ({ uid: String(x.uid), mode: x.mode, session: String(x.session || ""), name: String(x.name || ""), sno: String(x.student_no || ""), partner: String(x.partner || ""),
  stake: +x.stake, o: +x.ug_offer, m: x.ug_min_accept === "" ? "" : +x.ug_min_accept, r: x.ug_response === "accept" ? "A" : x.ug_response === "reject" ? "R" : "",
  g: +x.dg_gift, b: x.guess_avg_offer === "" ? "" : +x.guess_avg_offer, t: String(x.client_time || ""), received: String(x.received || "") });
let POLL = null, SIG = "";
function startPoll() {
  if (POLL) return;
  const tick = async () => {
    if (!document.getElementById("lstat") && !document.getElementById("pres")) { clearInterval(POLL); POLL = null; return; }
    try {
      await pull();
      const sig = sessionData().map((d) => d.uid).join();
      if (sig !== SIG) { SIG = sig; if ($("pres")) present(); else if (["live", "data", "pair"].includes(LTAB) && !document.activeElement.matches("input,textarea,select")) lecturer(LTAB); }
    } catch (e) {}
    lStat();
  };
  tick(); POLL = setInterval(tick, SERVER ? 3000 : 6000);
}

/* ---------- results ---------- */
const pct = (x, s) => (100 * x) / s;
const mean = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : NaN);
const median = (a) => { if (!a.length) return NaN; const b = [...a].sort((x, y) => x - y), k = b.length >> 1; return b.length % 2 ? b[k] : (b[k - 1] + b[k]) / 2; };
const f0 = (x) => (isNaN(x) ? "–" : Math.round(x) + "%");
const BINS = ["0%", "1–10%", "11–20%", "21–30%", "31–40%", "41–50%", "51–60%", "61–70%", "71–80%", "81–90%", "91–100%"];
const binOf = (p) => (p <= 0 ? 0 : Math.min(10, Math.ceil(p / 10)));
const shares = (ps) => { const c = new Array(11).fill(0); ps.forEach((p) => c[binOf(p)]++); return c.map((x) => (ps.length ? (100 * x) / ps.length : 0)); };
function summary(d) {
  const s = d.filter((x) => x.mode === "S"), p = d.filter((x) => x.mode === "P");
  return { s, p, offers: d.map((x) => pct(x.o, x.stake)), gifts: d.map((x) => pct(x.g, x.stake)), mins: s.map((x) => pct(x.m, x.stake)),
    guesses: s.filter((x) => x.b !== "").map((x) => pct(x.b, x.stake)), rej: p.filter((x) => x.r === "R").length };
}
function statsHtml(S, big) {
  const st = (v, l) => `<div class="stat"><div class="v" ${big ? 'style="font-size:40px"' : ""}>${v}</div><div class="l" ${big ? 'style="font-size:16px"' : ""}>${l}</div></div>`;
  return `<div class="stats">${st(f0(mean(S.offers)), `Average Ultimatum offer${big ? "" : ` (median ${f0(median(S.offers))})`}`)}
    ${st(f0(mean(S.gifts)), "Average Dictator gift")}
    ${st(f0((100 * S.gifts.filter((x) => x === 0).length) / S.gifts.length), "Gave nothing as Dictator")}
    ${S.s.length ? st(f0(mean(S.mins)), "Average minimum acceptable offer") + st(f0(mean(S.guesses)), big ? "You guessed the average offer would be" : "Average guess of the class offer") : ""}
    ${S.p.length ? st(`${S.rej} of ${S.p.length}`, "Live offers rejected") : ""}</div>`;
}
function lLive() {
  const d = sessionData();
  if (!d.length) { $("lt").innerHTML = `<div class="card"><p>No results yet for this session. They appear here automatically as students submit.</p></div>`; return; }
  const S = summary(d);
  $("lt").innerHTML = `<div class="card"><h2>Results</h2>${statsHtml(S)}
    <h3>Ultimatum offers and Dictator gifts</h3>
    <div class="legend"><span><i style="background:var(--ug)"></i>Ultimatum offer</span><span><i style="background:var(--dg)"></i>Dictator gift</span></div>
    <div class="chart" id="ch1"></div>
    ${S.s.length ? `<h3>Share who would accept each offer</h3><div class="chart" id="ch2"></div>` : ""}</div>`;
  barChart($("ch1"), shares(S.offers), shares(S.gifts), S.offers.length);
  if (S.s.length) acceptChart($("ch2"), S.mins);
}
function present() {
  const d = sessionData(), S = summary(d), s = curSession();
  view(`<div id="pres">
    <div class="row noprint" style="justify-content:space-between;margin-bottom:12px"><h2 style="font-size:30px;margin:0">Class results · ${esc(s.code)}</h2>
      <div class="row"><span class="pill" style="font-size:16px">${d.length} players</span><button type="button" id="fs">Full screen</button><button type="button" id="px">Back</button></div></div>
    ${!d.length ? `<div class="card"><p style="font-size:22px">Waiting for results…</p></div>` : `${statsHtml(S, true)}
    <div class="card" style="margin-top:14px"><h3 style="margin-top:0;font-size:20px">Ultimatum offers and Dictator gifts</h3>
      <div class="legend" style="font-size:16px"><span><i style="background:var(--ug)"></i>Ultimatum offer</span><span><i style="background:var(--dg)"></i>Dictator gift</span></div>
      <div class="chart" id="pc1"></div></div>
    ${S.s.length ? `<div class="card"><h3 style="margin-top:0;font-size:20px">Share who would accept each offer</h3><div class="chart" id="pc2"></div></div>` : ""}`}</div>`, true);
  if (d.length) { barChart($("pc1"), shares(S.offers), shares(S.gifts), S.offers.length); if (S.s.length) acceptChart($("pc2"), S.mins); }
  $("px").onclick = () => { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); lecturer(LTAB); };
  $("fs").onclick = () => document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {});
  startPoll();
}

/* ---------- charts ---------- */
const tip = $("tip");
function hover(el, html) {
  el.addEventListener("mousemove", (e) => { tip.innerHTML = html; tip.style.display = "block"; tip.style.left = e.pageX + 12 + "px"; tip.style.top = e.pageY - 36 + "px"; });
  el.addEventListener("mouseleave", () => (tip.style.display = "none"));
}
function barChart(host, a, b, n) {
  const W = 860, H = 300, L = 44, R = 10, T = 14, B = 46, gw = (W - L - R) / 11, bw = Math.min(22, (gw - 10) / 2);
  const top = Math.max(10, Math.ceil(Math.max(...a, ...b) / 10) * 10), y = (v) => T + (H - T - B) * (1 - v / top);
  let g = "";
  for (let t = 0; t <= top; t += top > 50 ? 20 : 10) g += `<line class="axis" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t}%</text>`;
  const bar = (x, v, col) => { const h = Math.max(0, y(0) - y(v)), r = Math.min(4, h); return v > 0 ? `<path d="M${x},${y(0)} v${-(h - r)} q0,${-r} ${r},${-r} h${bw - 2 * r} q${r},0 ${r},${r} v${h - r} z" fill="${col}"/>` : ""; };
  for (let i = 0; i < 11; i++) {
    const x0 = L + i * gw + (gw - 2 * bw - 2) / 2;
    g += `<g data-i="${i}">${bar(x0, a[i], "var(--ug)")}${bar(x0 + bw + 2, b[i], "var(--dg)")}<rect x="${L + i * gw}" y="${T}" width="${gw}" height="${H - T - B}" fill="transparent"/></g>`;
    g += `<text x="${L + i * gw + gw / 2}" y="${H - B + 16}" text-anchor="middle">${BINS[i]}</text>`;
  }
  g += `<text x="${(W + L) / 2}" y="${H - 6}" text-anchor="middle">Amount given, as a share of the stake</text>`;
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ultimatum offers and Dictator gifts">${g}</svg>`;
  host.querySelectorAll("g[data-i]").forEach((el) => { const i = +el.dataset.i; hover(el, `<b>${BINS[i]}</b><br>Ultimatum: ${Math.round(a[i])}%<br>Dictator: ${Math.round(b[i])}%<br>of ${n} players`); });
}
function acceptChart(host, mins) {
  const W = 860, H = 260, L = 44, R = 16, T = 14, B = 46;
  const xs = Array.from({ length: 11 }, (_, i) => i * 10), acc = xs.map((x) => (100 * mins.filter((m) => m <= x + 1e-9).length) / mins.length);
  const X = (v) => L + ((W - L - R) * v) / 100, Y = (v) => T + (H - T - B) * (1 - v / 100);
  let g = "";
  for (let t = 0; t <= 100; t += 25) g += `<line class="axis" x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L - 6}" y="${Y(t) + 4}" text-anchor="end">${t}%</text>`;
  xs.forEach((x) => (g += `<text x="${X(x)}" y="${H - B + 16}" text-anchor="middle">${x}%</text>`));
  g += `<path d="${xs.map((x, i) => (i ? "L" : "M") + X(x) + "," + Y(acc[i])).join(" ")}" fill="none" stroke="var(--ug)" stroke-width="2"/>`;
  xs.forEach((x, i) => (g += `<circle cx="${X(x)}" cy="${Y(acc[i])}" r="5" fill="var(--ug)" stroke="var(--card)" stroke-width="2"/><circle data-i="${i}" cx="${X(x)}" cy="${Y(acc[i])}" r="16" fill="transparent"/>`));
  g += `<text x="${(W + L) / 2}" y="${H - 6}" text-anchor="middle">Offer, as a share of the stake</text>`;
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Share of responders who would accept each offer">${g}</svg>`;
  host.querySelectorAll("circle[data-i]").forEach((el) => { const i = +el.dataset.i; hover(el, `Offer ${xs[i]}%: ${Math.round(acc[i])}% would accept`); });
}

/* ---------- pairing: random ring, so every student proposes once and responds once ---------- */
function shuffle(a) { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function makePairs(list) {
  const o = Object.fromEntries(list.map((d) => [d.uid, { session: CUR, uid: d.uid, name: d.name, offer_made: d.o, offer_made_result: "", offer_received: 0, offer_received_result: "",
    ug_earnings: 0, dg_given: d.g, dg_received: 0, dg_earnings: 0, total: 0, _proposed_to: "", _offer_from: "", _gift_from: "" }]));
  const u = shuffle(list), g = shuffle(list);
  u.forEach((p, i) => {
    const r = u[(i + 1) % u.length], offer = (p.o * r.stake) / p.stake, ok = offer >= r.m;
    o[p.uid].offer_made_result = ok ? "accepted" : "rejected"; o[p.uid].ug_earnings += ok ? p.stake - p.o : 0; o[p.uid]._proposed_to = r.name;
    o[r.uid].offer_received = Math.round(offer); o[r.uid].offer_received_result = ok ? "accepted" : "rejected"; o[r.uid].ug_earnings += ok ? Math.round(offer) : 0; o[r.uid]._offer_from = p.name;
  });
  g.forEach((p, i) => { const r = g[(i + 1) % g.length]; o[p.uid].dg_earnings += p.stake - p.g; o[r.uid].dg_received = Math.round((p.g * r.stake) / p.stake); o[r.uid].dg_earnings += o[r.uid].dg_received; o[r.uid]._gift_from = p.name; });
  Object.values(o).forEach((x) => (x.total = x.ug_earnings + x.dg_earnings));
  return Object.values(o);
}
function lPair() {
  const list = sessionData().filter((d) => d.mode === "S"), saved = store.get("lpairs", {})[CUR];
  $("lt").innerHTML = `<div class="card"><h2>Pair and pay</h2>
    <p class="sub">Students are paired at random: each one proposes to one classmate and responds to another, and a new random pairing is used for the Dictator Game. Students see their own result in <b>My results</b>; they never see who their partner was.</p>
    ${list.length < 2 ? `<p>At least two students are needed.</p>` : `<button class="primary noprint" type="button" id="go">${saved ? "Pair again (new random pairs)" : `Pair the ${list.length} students now`}</button>`}
    <p class="err" id="e"></p>
    ${saved ? `<p class="muted small">Paired ${new Date(saved.when).toLocaleString()} · ${saved.rows.length} students · ${saved.rows.filter((x) => x.offer_made_result === "rejected").length} offers rejected · ${saved.uploaded ? "students can see their results" : "<b>not yet sent</b>, will retry"}${list.length > saved.rows.length ? ` · <b>${list.length - saved.rows.length} new student(s) since pairing</b>` : ""}</p>
      <div class="tablewrap"><table><tr><th>Student</th><th>Proposed to</th><th>Result</th><th>Got offer from</th><th>Result</th><th class="num">Ultimatum</th><th class="num">Dictator</th><th class="num">Total</th></tr>
      ${saved.rows.slice().sort((a, b) => a.name.localeCompare(b.name)).map((x) => `<tr><td>${esc(x.name)}</td><td>${esc(x._proposed_to)}</td><td>${x.offer_made_result}</td><td>${esc(x._offer_from)}</td><td>${x.offer_received_result}</td><td class="num">${x.ug_earnings.toLocaleString()}</td><td class="num">${x.dg_earnings.toLocaleString()}</td><td class="num"><b>${x.total.toLocaleString()}</b></td></tr>`).join("")}</table></div>` : ""}
  </div>`;
  if ($("go")) $("go").onclick = async () => {
    if (saved && !confirm("Make new random pairs? Students' results will change.")) return;
    const rows = makePairs(list), all = store.get("lpairs", {});
    all[CUR] = { when: new Date().toISOString(), rows, uploaded: false }; store.set("lpairs", all);
    await uploadPairs(); lecturer("pair");
  };
  if (saved && !saved.uploaded) uploadPairs().then((ok) => ok && lecturer("pair"));
}
async function uploadPairs() {
  const all = store.get("lpairs", {}), x = all[CUR]; if (!x) return false;
  try { await bPost({ action: "saveOutcomes", key: KEY, session: CUR, rows: x.rows.map(({ _proposed_to, _offer_from, _gift_from, ...r }) => r) }); x.uploaded = true; store.set("lpairs", all); return true; }
  catch (e) { return false; }
}

/* ---------- data and backup codes ---------- */
function lData() {
  const d = sessionData();
  $("lt").innerHTML = `<div class="card"><h2>Data</h2>
    <p class="sub">${SERVER ? "Everything is also saved on the laptop in the <i>results</i> folder." : "Everything is also in your Google Sheet (tab <i>Responses</i>)."}</p>
    <div class="row noprint"><button type="button" id="csv">Download CSV</button><button type="button" id="sync">Sync now</button></div>
    <div class="tablewrap" style="margin-top:12px"><table><tr><th>Name</th><th>Student no.</th><th>Mode</th><th class="num">Offer</th><th class="num">Min accept</th><th>Response</th><th class="num">Dictator gift</th><th class="num">Guess</th></tr>
    ${d.map((x) => `<tr><td>${esc(x.name)}${x.partner ? " → " + esc(x.partner) : ""}</td><td>${esc(x.sno)}</td><td>${x.mode === "S" ? "own device" : "shared"}</td><td class="num">${x.o}</td><td class="num">${x.m === "" ? "–" : x.m}</td><td>${x.r === "A" ? "accepted" : x.r === "R" ? "rejected" : "–"}</td><td class="num">${x.g}</td><td class="num">${x.b === "" ? "–" : x.b}</td></tr>`).join("")}
    </table></div></div>`;
  $("csv").onclick = () => {
    const pr = Object.fromEntries(((store.get("lpairs", {})[CUR] || {}).rows || []).map((x) => [x.uid, x]));
    const head = "session,name,student_no,mode,partner,stake,ug_offer,ug_min_accept,ug_response,dg_gift,guess_avg_offer,ug_offer_pct,dg_gift_pct,ug_earnings,dg_earnings,total_earnings,submitted";
    const q = (v) => (/[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v);
    const rows = d.map((x) => { const p = pr[x.uid] || {}; return [CUR, x.name, x.sno, x.mode === "S" ? "own_device" : "shared_device", x.partner, x.stake, x.o, x.m, x.r === "A" ? "accept" : x.r === "R" ? "reject" : "", x.g, x.b,
      pct(x.o, x.stake).toFixed(1), pct(x.g, x.stake).toFixed(1), p.ug_earnings ?? "", p.dg_earnings ?? "", p.total ?? "", x.received || x.t].map(q).join(","); });
    download(`eco414-${CUR}-${new Date().toISOString().slice(0, 10)}.csv`, head + "\n" + rows.join("\n") + "\n", "text/csv");
  };
  $("sync").onclick = async () => { $("sync").textContent = "Syncing…"; try { await pull(); } catch (e) {} lecturer("data"); };
}
function lCodes() {
  $("lt").innerHTML = `<div class="card"><h2>Add codes</h2>
    <p class="sub">For students whose device never got online: scan the QR code on their screen, or paste their codes (for example from WhatsApp). They are added to this session and uploaded when you are online.</p>
    <button class="primary" type="button" id="cam">📷 Scan QR codes</button><div id="camBox" style="margin-top:10px"></div>
    <label for="paste">Paste codes</label><textarea id="paste" placeholder="S-${esc(CUR)}-TAWONGA-450-300-200-500-1000"></textarea>
    <button type="button" id="add" style="margin-top:8px">Add codes</button>
    <p class="notice" id="msg" style="margin-top:12px">Ready.</p></div>`;
  const add = (recs, src) => {
    recs.forEach((r) => { if (!r.session) r.session = CUR; });
    const have = new Set(allData().map((x) => x.uid)), fresh = recs.filter((r) => !have.has(r.uid));
    LOCAL.push(...fresh); store.set("llocal", LOCAL); queue(fresh); flush();
    $("msg").textContent = !recs.length ? `No valid codes in ${src}.` : fresh.length ? `${fresh.length} added from ${src}.` : "Already added.";
    lStat(); return fresh.length > 0;
  };
  $("add").onclick = () => { add(parseCodes($("paste").value), "the text"); $("paste").value = ""; };
  $("cam").onclick = () => startCam($("camBox"), (t) => add(parseCodes(t), "the camera"), (m) => ($("msg").textContent = m));
}
function download(name, text, type) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
